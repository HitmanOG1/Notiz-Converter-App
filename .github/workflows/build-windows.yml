name: Build Windows EXE and Release

on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg (static build)
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          powershell -Command "Expand-Archive -Force ffmpeg.zip -DestinationPath ffmpeg_tmp"
          Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName -Destination ./ }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --add-data "ffmpeg.exe;." --noconfirm --name NotizConverterApp app.py

      - name: Create release tag
        id: release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: "NotizConverterApp v${{ github.run_number }}"
          draft: true
          body: |
            Automated build from workflow run ${{ github.run_id }}.

      - name: Zip artifacts
        run: |
          mkdir -p out
          if [ -f dist/NotizConverterApp.exe ]; then cp dist/NotizConverterApp.exe out/; fi
          if [ -f ffmpeg.exe ]; then cp ffmpeg.exe out/; fi
          powershell -Command "Compress-Archive -Path out\* -DestinationPath out\NotizConverterApp.zip -Force"

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: out/NotizConverterApp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
